repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
        args: ['--maxkb=500']
      - id: check-merge-conflict

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.0
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: local
    hooks:
      - id: backend-tests
        name: Backend Tests
        entry: bash -c "cd backend && python -m pytest tests/ -q"
        language: system
        pass_filenames: false
        always_run: true
      - id: frontend-build
        name: Frontend Build Check
        entry: bash -c "cd client-portal && npm run build && cd ../admin-dashboard && npm run build"
        language: system
        pass_filenames: false
        always_run: true
